name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default build (no MSI metadata support on Linux).
          - name: linux
            os: ubuntu-latest
            tags: ""
            install_msitools: false
            install_libmsi: false
          # libmsi build: links directly against the libmsi C library via cgo.
          - name: linux-libmsi
            os: ubuntu-latest
            tags: libmsi
            install_msitools: true
            install_libmsi: true
          # Windows build (uses the Windows Installer automation API).
          - name: windows
            os: windows-latest
            tags: ""
            install_msitools: false
            install_libmsi: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install msitools
        if: matrix.install_msitools
        run: sudo apt-get update && sudo apt-get install -y msitools

      - name: Install libmsi dev headers
        if: matrix.install_libmsi
        run: sudo apt-get install -y libmsi-dev, libglib2.0-dev

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Build with tags
        if: matrix.tags != ''
        run: go build -tags ${{ matrix.tags }} ./...

      - name: Test with tags
        if: matrix.tags != ''
        run: go test -tags ${{ matrix.tags }} ./...

      - name: Vet
        run: go vet ./...
